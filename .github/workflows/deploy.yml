name: iOS Beta Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_ios:
    name: Build & Deploy iOS
    runs-on: macos-15
    timeout-minutes: 60
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📋 Show Environment
        run: |
          flutter --version
          xcodebuild -version
          ruby --version

      - name: 🔧 Create .env File
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo "✅ .env created"

      - name: 🧹 Clean Everything
        run: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          rm -rf ios/Flutter/Generated.xcconfig ios/Flutter/flutter_export_environment.sh
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: 📦 Flutter Pub Get
        run: flutter pub get

      - name: 💎 Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: 🔐 Setup Match Certificates
        run: bundle exec fastlane match appstore --readonly
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      - name: 📦 Pod Install
        run: pod install --repo-update
        working-directory: ios

      - name: 📋 Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>HZRNS9BK37</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>br.com.pablocustodio.traineasy</key>
              <string>match AppStore br.com.pablocustodio.traineasy</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: 🔨 Build IPA (Flutter)
        timeout-minutes: 30
        run: |
          flutter build ipa \
            --release \
            --export-options-plist=ios/ExportOptions.plist \
            2>&1 | tee build.log
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== BUILD FAILED ==="
            tail -100 build.log
            exit 1
          fi
          echo "✅ IPA created"
          ls -la build/ios/ipa/

      - name: 🚀 Upload to TestFlight
        timeout-minutes: 30
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"
          bundle exec fastlane pilot upload --ipa "$IPA_PATH" --skip_waiting_for_build_processing true
        working-directory: .
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
