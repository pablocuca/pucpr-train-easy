name: iOS Beta Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_ios:
    name: Build & Deploy iOS
    runs-on: macos-15
    timeout-minutes: 90
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📋 Show Environment
        run: |
          echo "=== Flutter ==="
          flutter --version
          echo ""
          echo "=== Xcode ==="
          xcodebuild -version
          echo ""
          echo "=== Ruby ==="
          ruby --version

      - name: 🔧 Create .env File
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo "✅ .env created"

      - name: 🧹 Clean Everything
        run: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
          rm -rf ios/Flutter/Generated.xcconfig ios/Flutter/flutter_export_environment.sh
          rm -rf ~/Library/Developer/Xcode/DerivedData
          echo "✅ Full clean completed"

      - name: 📦 Flutter Pub Get
        run: flutter pub get

      - name: � Verify Generated.xcconfig
        run: |
          echo "=== Generated.xcconfig ==="
          cat ios/Flutter/Generated.xcconfig
          echo ""
          echo "=== Verifying paths are correct ==="
          grep "FLUTTER_ROOT\|FLUTTER_APPLICATION_PATH" ios/Flutter/Generated.xcconfig

      - name: 💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: 📦 Pod Install
        run: pod install --repo-update
        working-directory: ios

      - name: � Build with xcodebuild (Direct)
        timeout-minutes: 30
        run: |
          set -x
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            archive \
            FLUTTER_BUILD_MODE=release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcpretty || {
              echo "=== XCODEBUILD FAILED ==="
              echo "Last 100 lines of log:"
              tail -100 xcodebuild.log
              exit 1
            }
        working-directory: ios

      - name: 🚀 Run Fastlane (Skip Build)
        timeout-minutes: 30
        run: bundle exec fastlane beta_upload
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
