name: iOS Beta Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_ios:
    name: Build & Deploy iOS
    runs-on: macos-14
    
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: � Flutter Doctor
        run: flutter doctor -v

      - name: �🔧 Create .env File
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo "✅ .env created with $(wc -l < .env) lines"

      - name: 🧹 Clean Flutter (Full Reset)
        run: |
          flutter clean
          rm -rf ios/Pods
          rm -rf ios/Podfile.lock
          rm -rf ios/.symlinks
          rm -rf ios/Flutter/Flutter.framework
          rm -rf ios/Flutter/Flutter.podspec
          rm -f ios/Flutter/Generated.xcconfig
          rm -f ios/Flutter/flutter_export_environment.sh
          echo "✅ Full clean completed"

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Pre-build Flutter iOS
        run: |
          echo "� Building Flutter iOS assets..."
          flutter build ios --release --no-codesign --verbose
          echo "✅ Flutter iOS pre-build completed"

      - name: �💎 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: 📦 Install CocoaPods
        run: |
          pod install --repo-update
          echo "✅ CocoaPods installed"
        working-directory: ios

      - name: 📋 Verify Generated.xcconfig
        run: |
          echo "=== Generated.xcconfig ==="
          cat ios/Flutter/Generated.xcconfig || echo "File not found!"
          echo ""
          echo "=== flutter_export_environment.sh ==="
          cat ios/Flutter/flutter_export_environment.sh || echo "File not found!"
        
      - name: 🚀 Run Fastlane Beta
        timeout-minutes: 45
        run: bundle exec fastlane beta
        working-directory: ios
        env:
          VERBOSE_SCRIPT_LOGGING: "true"
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
